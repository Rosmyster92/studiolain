site:
  name: Studio Lain & Partners
  site: 'https://www.studiolain.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Studio Lain & Partners
    template: '%s — Studio Lain & Partners'
  description: "Studio di Consulenza del Lavoro a Malo (VI). Diritto del lavoro, gestione del personale, costi del lavoro, politiche retributive, ricerca e selezione, sicurezza sul lavoro."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Studio Lain & Partners
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: it
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light'
